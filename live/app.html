<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c4473a">
<title>Know-It-All Live</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one card per game phase; the host view is the same card scaled up with the QR and roster beside it. */
:root{
  --paper:#f3f6f1; --sheet:#ffffff; --ink:#1d2421; --muted:#5d6a63;
  --form:#c4473a; --rule:#d9e1db; --lead:#2b2f33;
  --ok:#2f7d4f; --ok-soft:#dcefe2; --bad:#b33a2e; --bad-soft:#f7dedb;
  --c0:#c4473a; --c1:#2f62a8; --c2:#b8860b; --c3:#2f7d4f;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#141816; --sheet:#1c211f; --ink:#e7ece9; --muted:#9aa8a0;
  --form:#e57a6c; --rule:#2e3632; --lead:#e7ece9;
  --ok:#6fcf97; --ok-soft:#1f3328; --bad:#f08a7e; --bad-soft:#3b2220;
  --c0:#d8574a; --c1:#4b7fc9; --c2:#c99a1c; --c3:#3f9a64; color-scheme:dark}}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-top:18px}
.host .wrap{max-width:1180px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--form);padding-bottom:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;color:var(--form);line-height:1}
.brand small{display:block;font-weight:500;font-size:13px;letter-spacing:.14em;color:var(--muted);margin-top:4px}
.meta{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:22px 20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.lbl{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--form)}
.lbl .sub{color:var(--muted);font-weight:500}
h1{font-size:24px;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.host h1{font-size:40px}
p{margin:0}
.muted{color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
.host .opts{grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);
  background:transparent;border:1px solid var(--rule);border-left:6px solid var(--cc);border-radius:6px;padding:14px;cursor:pointer;touch-action:manipulation}
.host .opt{font-size:24px;padding:18px}
.opt:focus-visible{outline:2px solid var(--form);outline-offset:2px}
.bub{flex:none;width:32px;height:32px;border-radius:50%;background:var(--cc);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:15px;color:#fff}
.opt:disabled{cursor:default;opacity:.55}
.opt.pick{opacity:1;background:var(--paper);border-color:var(--cc)}
.opt.right{opacity:1;background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{opacity:1;background:var(--bad-soft);border-color:var(--bad)}
.why{font-size:16px;color:var(--muted);border-left:3px solid var(--form);padding-left:12px}
.why b{color:var(--ink)}
.btn{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--form);color:#fff;border:0;border-radius:6px;padding:13px 24px;cursor:pointer;touch-action:manipulation}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--form);border:1.5px solid var(--form)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
input,textarea{font:inherit;font-size:18px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px;width:100%}
textarea{min-height:140px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--form);outline-offset:1px}
.big{font-family:var(--f-display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big.ok{color:var(--ok)} .big.bad{color:var(--bad)}
.note{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.board li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule);font-size:16px}
.host .board li{font-size:20px}
.board .r{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.board .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board .me .nm{font-weight:600}
.board .pts{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.tag{font-family:var(--f-mono);font-size:13px;margin-left:6px}
.tag.ok{color:var(--ok)} .tag.bad{color:var(--bad)} .tag.gain{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:16px;border:1px solid var(--rule);border-radius:999px;padding:5px 12px;background:var(--paper)}
.chip.done{border-color:var(--ok);color:var(--ok)}
.chip.away{opacity:.45}
.chip button{font:inherit;background:none;border:0;color:var(--muted);cursor:pointer;padding:0 0 0 6px}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.host .split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.qr{background:#fff;border-radius:6px;padding:10px;width:100%;max-width:340px;aspect-ratio:1;align-self:center}
.url{font-family:var(--f-mono);font-size:20px;word-break:break-all;text-align:center}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;text-align:center}
.step{background:var(--paper);border:1px solid var(--rule);border-radius:6px 6px 0 0;padding:10px 6px;display:flex;flex-direction:column;gap:4px}
.step .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .place{font-family:var(--f-display);font-weight:700;font-size:28px;color:var(--form)}
.step.p1{min-height:150px;border-color:var(--form)} .step.p2{min-height:115px} .step.p3{min-height:90px}
.err{color:var(--bad);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Know-It-All Live<small id="sub">General knowledge · 20 questions</small></div>
    <div class="meta" id="meta"></div>
  </header>
  <main id="app"></main>
</div>
<script>
const HOST=location.pathname.startsWith("/host"), KEY=new URLSearchParams(location.search).get("k")||"";
if(HOST)document.body.classList.add("host");
const app=document.getElementById("app"), meta=document.getElementById("meta");
const L="ABCD";
let pid=null; try{pid=localStorage.getItem("kia.pid")}catch(e){}
let S=null, screenKey="", hazelSent=false, busy=false, lastSig="";

function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
async function post(path,body){const r=await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.json()}
const host=a=>post("/api/host/"+a,{k:KEY});

async function poll(){
  try{
    const r=await fetch(`/api/state?pid=${encodeURIComponent(pid||"")}&k=${encodeURIComponent(KEY)}`);
    S=await r.json();
    if(!HOST&&pid&&!S.joined){pid=null;try{localStorage.removeItem("kia.pid")}catch(e){}}
    render();
  }catch(e){meta.textContent="Reconnecting…"}
  setTimeout(poll,800);
}

function render(){
  const sig=JSON.stringify(S)+hazelSent+pid;if(sig===lastSig)return;lastSig=sig;
  const n=S.players.length;
  meta.textContent=S.phase==="lobby"?`${n} player${n===1?"":"s"}`:
    (S.phase==="question"||S.phase==="reveal")?`Q ${S.qi+1} / ${S.n}${S.me?` · ${S.me.score} pts`:""}`:
    S.me?`${S.me.score} pts`:"";
  if(!HOST&&!S.joined) return show("join",joinScreen);
  // screens with inputs are drawn once per key; everything else redraws each poll
  const k=S.phase+":"+S.qi;
  if(S.phase==="hazel"&&!HOST&&!S.me.hazel&&!hazelSent) return show("hazel",hazelScreen);
  const f={lobby:lobby,question:question,reveal:reveal,hazel:hazelWait,final:final}[S.phase];
  show(null,f);
}
function show(key,fn){
  if(key&&key===screenKey)return;
  screenKey=key||"";
  const c=el("section","card");fn(c);app.replaceChildren(c);
}

function joinScreen(c){
  c.append(el("div","lbl","Join the game"),el("h1",null,"What should we call you?"));
  const i=el("input");i.id="name";i.maxLength=16;i.autocomplete="nickname";i.placeholder="Your name";
  const b=el("button","btn","Join");b.id="join";const err=el("p","err");
  const go=async()=>{const name=i.value.trim();if(!name){err.textContent="Type a name first.";return}
    b.disabled=true;const r=await post("/api/join",{name});pid=r.pid;try{localStorage.setItem("kia.pid",pid)}catch(e){}
    screenKey="";};
  b.onclick=go;i.onkeydown=e=>{if(e.key==="Enter")go()};
  const row=el("div","row");row.append(b);c.append(i,err,row);setTimeout(()=>i.focus(),50);
}

function chips(players,{kick=false,doneFn=null}={}){
  const w=el("div","chips");
  players.forEach(p=>{const ch=el("span","chip"+(doneFn&&doneFn(p)?" done":"")+(p.active?"":" away"),p.name+(p.me?" (you)":""));
    if(kick&&HOST){const x=el("button",null,"×");x.title="Remove "+p.name;x.onclick=()=>post("/api/host/kick",{k:KEY,pid:p.pid});ch.append(x)}
    w.append(ch)});
  return w;
}
function board(players,{reveal=false,limit=0}={}){
  const ul=el("ul","board");
  (limit?players.slice(0,limit):players).forEach(p=>{
    const li=el("li",p.me?"me":"");const nm=el("span","nm",p.name+(p.me?" (you)":""));
    if(reveal){const t=p.pick==null?el("span","tag bad","no answer"):el("span","tag "+(p.ok?"ok":"bad"),`${L[p.pick]} ${p.ok?"✓":"✗"}`);nm.append(t)}
    const pts=el("span","pts",String(p.score));
    if(reveal&&p.pts){pts.prepend(el("span","tag gain",`+${p.pts} `))}
    li.append(el("span","r",String(p.rank)),nm,pts);ul.append(li)});
  return ul;
}

function lobby(c){
  if(HOST){
    const sp=el("div","split"),l=el("div"),r=el("div");
    l.style.cssText="display:flex;flex-direction:column;gap:14px;min-width:0";r.style.cssText=l.style.cssText;
    const img=el("img","qr");img.src="/qr.svg";img.alt="QR code to join";
    l.append(el("div","lbl","Scan to join"),img,el("div","url",S.join_url),el("p","muted","Phones must be on the same wifi as this laptop."));
    r.append(el("div","lbl",`Players · ${S.players.length}`),S.players.length?chips(S.players,{kick:true}):el("p","muted","Nobody yet."));
    const b=el("button","btn","Start game");b.id="start";b.disabled=!S.players.length;b.onclick=()=>host("start");
    const row=el("div","row");row.append(b);r.append(row);
    sp.append(l,r);c.append(sp);
  }else{
    c.append(el("div","lbl","You're in"),el("h1",null,`Hang tight, ${S.me.name}.`),
      el("p","muted","The game starts when the host presses Start."),el("div","lbl",`Players · ${S.players.length}`),chips(S.players));
  }
}

function opts(q,{pick=null,reveal=false,onPick=null}={}){
  const w=el("div","opts");
  q.c.forEach((t,k)=>{const b=el("button","opt");b.id="opt-"+k;b.style.setProperty("--cc",`var(--c${k})`);
    b.append(el("span","bub",L[k]),el("span",null,t));
    if(reveal){b.disabled=true;if(k===q.a)b.classList.add("right");else if(k===pick)b.classList.add("wrong")}
    else if(pick!=null||!onPick){b.disabled=true;if(k===pick)b.classList.add("pick")}
    else b.onclick=()=>onPick(k);
    w.append(b)});
  return w;
}

function question(c){
  const q=S.q;
  c.append(el("div","lbl",`Question ${S.qi+1} of ${S.n} · `),el("h1",null,q.q));
  c.firstChild.append(el("span","sub",q.s));
  const waiting=S.players.filter(p=>p.waiting);
  if(HOST){
    c.append(opts(q));
    const done=S.players.length-waiting.length;
    c.append(el("div","lbl",`Answered · ${done} / ${S.players.length} · ${q.elapsed}s`),chips(S.players,{kick:true,doneFn:p=>!p.waiting}));
    const b=el("button","btn ghost","Reveal now");b.id="force";b.onclick=()=>host("next");const row=el("div","row");row.append(b);c.append(row);
    return;
  }
  if(S.me.late){c.append(el("p","muted","You joined mid-question. You're in from the next one."));return}
  c.append(opts(q,{pick:S.me.answered?S.me.pick:null,onPick:async k=>{if(busy)return;busy=true;
    S.me.answered=true;S.me.pick=k;lastSig="";show(null,question);await post("/api/answer",{pid,k});busy=false}}));
  if(S.me.answered){c.append(el("p","muted",waiting.length?`Locked in. Waiting on ${waiting.map(p=>p.name).join(", ")}.`:"Locked in."))}
}

function reveal(c){
  const q=S.q;
  c.append(el("div","lbl",`Question ${S.qi+1} of ${S.n} · Answer`));
  if(!HOST&&S.me&&!S.me.late){
    const ok=S.me.ok;c.append(el("div","big "+(ok?"ok":"bad"),S.me.pick==null?"No answer":ok?`Correct  +${S.me.pts}`:"Wrong"));
  }
  c.append(el("h1",null,q.q),opts(q,{pick:HOST?null:S.me?.pick,reveal:true}));
  const why=el("p","why");why.append(el("b",null,`${L[q.a]}. ${q.c[q.a]}. `),q.x);c.append(why);
  c.append(el("div","lbl","Who got it"),board(S.players,{reveal:true}));
  if(HOST){const b=el("button","btn",S.qi+1<S.n?"Next question":"Final question");b.id="next";b.onclick=()=>host("next");
    const row=el("div","row");row.append(b);c.append(row)}
  else c.append(el("p","note","Waiting for the host to continue"));
}

function hazelScreen(c){
  c.append(el("div","lbl","Final question · Open response"),el("h1",null,"What is hazel?"),el("p","note","Not scored"));
  const t=el("textarea");t.id="hazel";t.setAttribute("aria-label","Your answer");t.placeholder="Write your answer…";
  const b=el("button","btn","Submit");b.id="hz";
  // the typed text is never sent anywhere; the server only learns this player is done
  b.onclick=async()=>{hazelSent=true;t.value="";screenKey="";await post("/api/hazel",{pid});render()};
  const row=el("div","row");row.append(b);c.append(t,row);
}
function hazelWait(c){
  const waiting=S.players.filter(p=>p.waiting);
  c.append(el("div","lbl","Final question · Open response · Not scored"),el("h1",null,"What is hazel?"));
  if(HOST){c.append(el("div","lbl",`Done · ${S.players.length-waiting.length} / ${S.players.length}`),chips(S.players,{kick:true,doneFn:p=>!p.waiting}));
    const b=el("button","btn ghost","Show results now");b.id="skip";b.onclick=()=>host("next");const row=el("div","row");row.append(b);c.append(row)}
  else c.append(el("p","muted",waiting.length?`Thanks. Waiting on ${waiting.map(p=>p.name).join(", ")}.`:"Thanks."));
}

function final(c){
  const P=S.players, top=P.slice(0,3);
  c.append(el("div","lbl","Final standings"),el("h1",null,P.length?`${P[0].name} wins.`:"No players."));
  if(top.length){const pd=el("div","podium");[1,0,2].forEach(i=>{const p=top[i];if(!p){pd.append(el("div"));return}
      const s=el("div","step p"+(i+1));s.append(el("span","place",["1st","2nd","3rd"][i]),el("span","nm",p.name),el("span","muted",`${p.score} pts · ${p.correct}/${S.n}`));pd.append(s)});c.append(pd)}
  if(!HOST&&S.me){const me=P.find(p=>p.me);c.append(el("p",null,`You finished #${me.rank} of ${P.length} with ${me.score} points (${me.correct}/${S.n} right).`))}
  c.append(board(P));
  if(HOST){const a=el("button","btn","Play again");a.id="again";a.onclick=()=>{hazelSent=false;host("start")};
    const b=el("button","btn ghost","Back to lobby");b.id="lobby";b.onclick=()=>host("lobby");const row=el("div","row");row.append(b,a);c.append(row)}
}
// a new game resets the per-player hazel flag on phones
let lastPhase="";const _render=render;render=function(){if(S.phase!==lastPhase&&S.phase!=="hazel"&&S.phase!=="final")hazelSent=false;lastPhase=S.phase;_render()};
poll();
</script>
</body>
</html>
