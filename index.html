<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c4473a">
<title>Know-It-All Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Barlow+Condensed:wght@500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: a single exam card on a quiz sheet; bubbles A–D are the answer controls. */
:root{
  --paper:#f3f6f1; --sheet:#ffffff; --ink:#1d2421; --muted:#5d6a63;
  --form:#c4473a; --form-soft:#f6dcd6; --rule:#d9e1db;
  --lead:#2b2f33; --ok:#2f7d4f; --ok-soft:#dcefe2; --bad:#b33a2e; --bad-soft:#f7dedb;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141816; --sheet:#1c211f; --ink:#e7ece9; --muted:#9aa8a0;
  --form:#e57a6c; --form-soft:#3a2522; --rule:#2e3632;
  --lead:#e7ece9; --ok:#6fcf97; --ok-soft:#1f3328; --bad:#f08a7e; --bad-soft:#3b2220; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141816; --sheet:#1c211f; --ink:#e7ece9; --muted:#9aa8a0;
  --form:#e57a6c; --form-soft:#3a2522; --rule:#2e3632;
  --lead:#e7ece9; --ok:#6fcf97; --ok-soft:#1f3328; --bad:#f08a7e; --bad-soft:#3b2220; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--form);padding-bottom:8px}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;color:var(--form);line-height:1}
.brand small{display:block;font-weight:500;font-size:13px;letter-spacing:.14em;color:var(--muted);margin-top:4px}
.meta{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.track{display:grid;gap:3px}
.track i{height:6px;border-radius:2px;background:var(--rule)}
.track i.ok{background:var(--ok)} .track i.bad{background:var(--bad)} .track i.now{background:var(--form)}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.qno{font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--form)}
.subj{color:var(--muted);font-weight:500}
h1{font-size:23px;font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;font:inherit;font-size:17px;color:var(--ink);
  background:transparent;border:1px solid var(--rule);border-radius:6px;padding:12px 14px;cursor:pointer;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--form)}
.opt:focus-visible{outline:2px solid var(--form);outline-offset:2px}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--form);display:grid;place-items:center;
  font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--form)}
.opt.pick .bub{background:var(--lead);border-color:var(--lead);color:var(--sheet)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt:disabled{cursor:default}
.why{font-size:16px;color:var(--muted);border-left:3px solid var(--form);padding-left:12px;margin:0}
.why b{color:var(--ink)}
.btn{align-self:flex-end;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.1em;text-transform:uppercase;
  background:var(--form);color:var(--sheet);border:0;border-radius:6px;padding:12px 22px;cursor:pointer;touch-action:manipulation}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--form);border:1.5px solid var(--form)}
textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:12px;min-height:140px;resize:vertical;width:100%;box-sizing:border-box}
textarea:focus{outline:2px solid var(--form);outline-offset:1px}
.note{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.score{font-family:var(--f-display);font-weight:700;font-size:72px;line-height:1;color:var(--form);font-variant-numeric:tabular-nums}
.score span{font-size:32px;color:var(--muted)}
.review{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.review li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--rule);font-size:15px}
.review .m{font-family:var(--f-mono);font-weight:600}
.review .m.ok{color:var(--ok)} .review .m.bad{color:var(--bad)}
.review .a{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
p{margin:0}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">Know-It-All<small>General knowledge · 30 questions</small></div>
    <div class="meta" id="meta">Q 1 / 30 · Score 0</div>
  </header>
  <div class="track" id="track"></div>
  <main id="app"></main>
</div>

<script>
const Q=[
 {s:"Travel",q:"Why do airplane windows have rounded corners?",a:"Square corners concentrate stress and start cracks",w:["Rounded glass is cheaper to make","They give passengers a wider view","Square windows fog up faster"],x:"The de Havilland Comet crashes of 1954 taught the industry how fast metal fatigue cracks grow from sharp corners."},
 {s:"Around the house",q:"At what frequency does household power alternate in the United States?",a:"60 Hz",w:["50 Hz","120 Hz","100 Hz"],x:"Most of Europe, Asia and Africa use 50 Hz. Japan uses both, split down the middle of the country."},
 {s:"Science",q:"Which metal is liquid at room temperature?",a:"Mercury",w:["Gallium","Lead","Sodium"],x:"Gallium is the trap: it melts at about 30 °C, so it turns liquid in your hand, but not on a table."},
 {s:"Around town",q:"Why are most manhole covers round?",a:"A circle can't fall through its own opening",w:["Round covers are cheaper to cast","They're easier to drive over","Round holes are faster to dig"],x:"A square cover can slip through diagonally. A round one is the same width in every direction."},
 {s:"Landmarks",q:"What type of bridge is the Golden Gate Bridge?",a:"Suspension",w:["Cable-stayed","Cantilever","Arch"],x:"The deck hangs from two main cables draped over the towers. In a cable-stayed bridge, the cables run straight from the towers to the deck."},
 {s:"Around the house",q:"Which gas was usually sealed inside old-fashioned incandescent light bulbs?",a:"Argon",w:["Helium","Neon","Oxygen"],x:"An inert gas slows the tungsten filament from evaporating. Oxygen would burn it out almost instantly."},
 {s:"Travel",q:"What color is an airplane's “black box” flight recorder?",a:"Bright orange",w:["Black","Silver","Yellow and black stripes"],x:"Orange makes it easier to find in wreckage. The name probably comes from early recorders' dark casings."},
 {s:"History",q:"The unit of power, the watt, is named after which inventor?",a:"James Watt",w:["Alessandro Volta","James Joule","Thomas Edison"],x:"Watt's steam engine improvements drove the Industrial Revolution. He also coined “horsepower” to sell his engines."},
 {s:"Tech",q:"What is the minimum number of satellites a GPS receiver needs to find its position in 3D?",a:"4",w:["3","2","6"],x:"Three would be enough if your phone had a perfect clock. The fourth satellite solves for the clock error."},
 {s:"Landmarks",q:"The Eiffel Tower was originally built as…",a:"a temporary entrance arch for a World's Fair",w:["a radio broadcasting tower","a monument to the French Revolution","an observation tower for the French army"],x:"It was built for the 1889 Exposition with a 20-year permit. Being useful as a radio antenna helped save it."},
 {s:"Landmarks",q:"Why does the Leaning Tower of Pisa lean?",a:"Soft ground under one side of its foundation",w:["An earthquake in the 1600s","It was designed to lean","Bombing damage in World War II"],x:"It started tilting during construction in the 1170s, when the first floors sank into soft clay."},
 {s:"Science",q:"What is the main ingredient in ordinary window glass?",a:"Sand (silica)",w:["Limestone","Salt","Quartz crystals from mines"],x:"Silica sand is melted with soda ash and lime, which lower its melting point."},
 {s:"Travel",q:"Which country holds the speed record for a train running on regular wheels and rails?",a:"France",w:["Japan","China","Germany"],x:"A French TGV hit 574.8 km/h in 2007. Japan's record of 603 km/h is for a maglev, which floats instead of using wheels."},
 {s:"Science",q:"Roughly how fast does sound travel through air at sea level?",a:"About 767 mph",w:["About 343 mph","About 1,100 mph","About 500 mph"],x:"That's about 343 meters per second, which is where the 343 trap comes from."},
 {s:"Around the house",q:"Which element makes stainless steel “stainless”?",a:"Chromium",w:["Nickel","Zinc","Carbon"],x:"At least 10.5% chromium forms a thin oxide layer that heals itself when scratched."},
 {s:"Tech",q:"QR codes were invented in Japan in 1994 to track what?",a:"Car parts in factories",w:["Train tickets","Grocery prices","Mail packages"],x:"Denso Wave, a Toyota supplier, needed something faster to scan than barcodes on the assembly line."},
 {s:"History",q:"Who is often called the first computer programmer?",a:"Ada Lovelace",w:["Alan Turing","Grace Hopper","Charles Babbage"],x:"In 1843 she published an algorithm for Charles Babbage's Analytical Engine, a machine that was never finished."},
 {s:"Around town",q:"Why are car tires black?",a:"Carbon black is added to make them stronger",w:["Natural rubber is black","Black dye hides dirt","Black rubber grips the road better when hot"],x:"Natural rubber is milky white. Carbon black adds strength and blocks UV light, which makes tires last far longer."},
 {s:"Science",q:"What is the most common element in Earth's crust?",a:"Oxygen",w:["Silicon","Iron","Aluminum"],x:"Oxygen is about 46% of the crust by mass, locked up in rocks as silicates and oxides. Silicon is second."},
 {s:"Tech",q:"What does “Wi-Fi” stand for?",a:"Nothing. It's a brand name.",w:["Wireless Fidelity","Wireless Fiber","Wide Field"],x:"A branding firm coined it in 1999 to sound like Hi-Fi. “Wireless Fidelity” was attached afterward."},
 {s:"Inventions",q:"What inspired the invention of Velcro?",a:"Burrs stuck to a dog's fur",w:["A bird's feathers","A gecko's feet","Fishing nets"],x:"George de Mestral looked at burdock burrs under a microscope after a walk in 1941 and saw tiny hooks."},
 {s:"Travel",q:"How does the Panama Canal get ships across Panama?",a:"Locks lift them up to a lake above sea level",w:["It's a straight sea-level cut","Ships are carried on rail cars","Tides push them through"],x:"Ships rise about 26 meters to Gatun Lake and are lowered again on the other side."},
 {s:"Inventions",q:"Which of these was invented first?",a:"The fax machine",w:["The telephone","The light bulb","The radio"],x:"Alexander Bain patented a fax machine in 1843, more than 30 years before the telephone in 1876."},
 {s:"Around town",q:"Why do bridges have gaps called expansion joints?",a:"The bridge grows and shrinks with temperature",w:["To let rainwater drain","To reduce traffic noise","To make repairs easier"],x:"A long steel bridge can change length by more than a meter between winter and summer."},
 {s:"Space",q:"About how long does sunlight take to reach Earth?",a:"8 minutes",w:["8 seconds","1 hour","1 day"],x:"It's about 8 minutes and 20 seconds, so the Sun you see is how it looked 8 minutes ago."},
 {s:"Tech",q:"In which decade was the first email sent?",a:"The 1970s",w:["The 1960s","The 1980s","The 1990s"],x:"Ray Tomlinson sent it in 1971 on ARPANET, and picked the @ sign to separate the user from the computer."},
 {s:"Inventions",q:"The microwave oven was invented after an engineer working on what noticed a candy bar melting in his pocket?",a:"Radar equipment",w:["Television cameras","Jet engines","Refrigerators"],x:"Percy Spencer was working on radar magnetrons at Raytheon in 1945."},
 {s:"Landmarks",q:"Why is the Statue of Liberty green?",a:"Its copper skin has weathered",w:["It was painted green","Algae grows on it","Green glass was mixed into the metal"],x:"It arrived copper-brown in 1886 and turned green within about 30 years. The patina now protects the metal underneath."},
 {s:"Around town",q:"Concrete hardens because it…",a:"reacts chemically with water",w:["dries out in the air","cools down after mixing","absorbs carbon dioxide"],x:"This reaction is called hydration. Concrete even sets underwater, and it keeps getting stronger for years."},
 {s:"Sports",q:"Why do golf balls have dimples?",a:"They reduce drag so the ball flies farther",w:["They make the ball easier to grip","They're left over from the molding process","They make the ball spin less"],x:"The dimples make the air around the ball turbulent, which keeps it hugging the ball and shrinks the drag-causing wake behind it."}
];
const L="ABCD", app=document.getElementById("app"), meta=document.getElementById("meta"), track=document.getElementById("track");
let order, i, score, log;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function el(t,c,h){const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e}
function drawTrack(){track.style.gridTemplateColumns=`repeat(${Q.length},1fr)`;track.innerHTML="";for(let k=0;k<Q.length;k++){const b=el("i");if(k<log.length)b.className=log[k].ok?"ok":"bad";else if(k===i)b.className="now";track.append(b)}}
function start(){order=shuffle(Q).map(q=>({...q,c:shuffle([q.a,...q.w])}));i=0;score=0;log=[];ask()}
function ask(){
  const q=order[i];meta.textContent=`Q ${i+1} / ${Q.length} · Score ${score}`;drawTrack();
  const c=el("section","card");
  c.append(el("div","qno",`Question ${i+1} <span class="subj">· ${q.s}</span>`),el("h1",null,q.q));
  const opts=el("div","opts");
  q.c.forEach((t,k)=>{const b=el("button","opt");b.id=`opt-${i}-${k}`;b.append(el("span","bub",L[k]),el("span",null,t));
    b.onclick=()=>answer(k,opts,c);opts.append(b)});
  c.append(opts);app.replaceChildren(c);
}
function answer(k,opts,c){
  const q=order[i],ok=q.c[k]===q.a;if(ok)score++;log.push({ok,q});
  [...opts.children].forEach((b,j)=>{b.disabled=true;if(q.c[j]===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
  opts.children[k].classList.add("pick");
  c.append(el("p","why",`<b>${ok?"Correct.":"Answer: "+q.a+"."}</b> ${q.x}`));
  const n=el("button","btn",i+1<Q.length?"Next":"Continue");n.id="next";
  n.onclick=()=>{i++;i<Q.length?ask():hazel()};c.append(n);n.focus({preventScroll:true});
  meta.textContent=`Q ${i+1} / ${Q.length} · Score ${score}`;drawTrack();
}
function hazel(){
  meta.textContent=`Done · Score ${score} / ${Q.length}`;drawTrack();
  const c=el("section","card");
  c.append(el("div","qno","Final question <span class=\"subj\">· Open response</span>"),el("h1",null,"What is hazel?"),
    el("p","note","Not scored"));
  const t=el("textarea");t.id="hazel";t.setAttribute("aria-label","Your answer");t.placeholder="Write your answer…";
  const b=el("button","btn","Finish");b.id="finish";
  b.onclick=()=>{t.value="";results()};   // answer is intentionally discarded
  c.append(t,b);app.replaceChildren(c);
}
function results(){
  const pct=Math.round(score/Q.length*100);
  const verdict=pct>=90?"Certified know-it-all.":pct>=75?"Seriously sharp.":pct>=60?"Solid. You know your stuff.":pct>=40?"Not bad at all.":"Tough one. Try it again?";
  const c=el("section","card");
  c.append(el("div","qno","Results"),el("div","score",`${score}<span> / ${Q.length}</span>`),el("p",null,`${pct}% · ${verdict}`));
  const ul=el("ul","review");
  log.forEach((r,k)=>{const li=el("li");li.append(el("span","m "+(r.ok?"ok":"bad"),r.ok?"✓":"✗"),
    el("div",null,`${k+1}. ${r.q.q}<br><span class="a">${r.q.a}</span>`));ul.append(li)});
  const row=el("div","row"),b=el("button","btn","Take it again");b.id="again";b.onclick=start;row.append(b);
  c.append(ul,row);app.replaceChildren(c);
}
start();
</script>
</body>
</html>
