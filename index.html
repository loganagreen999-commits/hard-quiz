<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<title>Know-It-All Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@800&family=Public+Sans:wght@400;600&display=swap">
<link rel="stylesheet" href="kia.css">
<style>
/* Layout: one column on a phone (question, then the four colour tiles under the thumb);
   on a wide screen the question holds the left half and the tiles stand in the right. */
#app>section{display:flex;flex-direction:column;gap:18px;min-width:0}
.ask{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.ask .side{display:flex;flex-direction:column;gap:18px;min-width:0}
.after{display:flex;flex-direction:column;gap:16px}
.after .btn{align-self:stretch}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.review li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:start;padding:12px 18px 12px 12px;background:var(--surface);border-radius:var(--r)}
.review .m{display:grid;place-items:center;width:36px;height:36px;border-radius:50%}
.review .m svg{width:20px;height:20px}
.review .m.ok{background:var(--accent);color:var(--accent-ink)}
.review .m.bad{background:var(--ink);color:var(--bg)}
.review .qq{font-size:17px;line-height:1.35}
.review .a{display:block;font-weight:600;margin-top:2px}
.score{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.score .n{font-family:var(--f-display);font-weight:800;font-size:clamp(120px,40vw,220px);line-height:.78;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.score .of{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,12vw,72px);line-height:.8;color:var(--muted)}
.res{display:grid;grid-template-columns:minmax(0,1fr);gap:22px}
.res .top{display:flex;flex-direction:column;gap:16px}
.pct{font-size:22px;line-height:1.35}
.pct b{font-weight:600}
@media (min-width:960px){
  body{--gut:40px}
  .wrap{max-width:1180px;padding-top:24px;gap:26px}
  .mark{font-size:36px}
  .meta{font-size:20px}
  .ask{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr;grid-template-areas:"side opts" "after opts";column-gap:40px;row-gap:22px;align-items:start}
  .ask .side{grid-area:side} .ask .opts{grid-area:opts} .ask .after{grid-area:after}
  .ask .q{font-size:clamp(48px,4.6vw,68px);line-height:.98}
  .ask .opts{gap:12px}
  .ask .opt{min-height:96px}
  .ask .opt .t{font-size:24px}
  .ask .opt .k{font-size:56px;width:38px}
  .res{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:48px;align-items:start}
  .res .top{position:sticky;top:24px}
  .hz{max-width:760px}
}
</style>
</head>
<body>

<a class="skip" href="#app">Skip to the quiz</a>
<div class="wrap">
  <header class="bar">
    <span class="mark" translate="no">Know-It-All</span>
    <span class="meta" id="meta" aria-live="polite">Q 1 / 20 · Score 0</span>
  </header>
  <div class="track" id="track" aria-hidden="true"></div>
  <main id="app" tabindex="-1"></main>
</div>

<script>
const Q=[
 {s:"Geography",q:"What is the capital of Switzerland?",a:"Bern",w:["Zurich","Geneva","Basel"],x:"Switzerland officially calls Bern its “federal city” rather than its capital. Zurich is the largest city."},
 {s:"Geography",q:"Which is the smallest of the world's five oceans?",a:"The Arctic Ocean",w:["The Southern Ocean","The Indian Ocean","The Atlantic Ocean"],x:"The Arctic is also the shallowest, and much of it is covered in sea ice."},
 {s:"History",q:"Who led the first expedition to reach the South Pole?",a:"Roald Amundsen",w:["Robert Falcon Scott","Ernest Shackleton","Edmund Hillary"],x:"Amundsen's Norwegian team got there on December 14, 1911. Scott arrived about five weeks later and died on the way back."},
 {s:"Geography",q:"Which African country has the largest population?",a:"Nigeria",w:["Ethiopia","Egypt","South Africa"],x:"Nigeria has more than 220 million people. Ethiopia is second."},
 {s:"History",q:"What is the oldest university in the English-speaking world?",a:"Oxford",w:["Cambridge","Harvard","St Andrews"],x:"Teaching at Oxford dates back to at least 1096. Cambridge was founded in 1209 by scholars leaving Oxford."},
 {s:"Music",q:"Who composed The Four Seasons?",a:"Antonio Vivaldi",w:["Johann Sebastian Bach","George Frideric Handel","Arcangelo Corelli"],x:"It's a set of four violin concertos, published in 1725, one for each season."},
 {s:"History",q:"Which treaty ended World War I between Germany and the Allies?",a:"The Treaty of Versailles",w:["The Treaty of Brest-Litovsk","The Treaty of Trianon","The Treaty of Paris"],x:"It was signed in 1919. Brest-Litovsk was Russia's separate peace with Germany in 1918, and Trianon dealt with Hungary."},
 {s:"Geography",q:"What is the largest island in the world?",a:"Greenland",w:["New Guinea","Borneo","Madagascar"],x:"Australia is counted as a continent, so Greenland, at about 2.2 million km², is the largest island."},
 {s:"Space",q:"Which planet is closest to Earth in size?",a:"Venus",w:["Mars","Mercury","Neptune"],x:"Venus is about 95% of Earth's diameter, which is why it's sometimes called Earth's twin."},
 {s:"Literature",q:"Who wrote War and Peace?",a:"Leo Tolstoy",w:["Fyodor Dostoevsky","Anton Chekhov","Ivan Turgenev"],x:"It was published in the 1860s and follows Russian families through Napoleon's invasion of 1812."},
 {s:"Geography",q:"What is the capital of Brazil?",a:"Brasília",w:["Rio de Janeiro","São Paulo","Salvador"],x:"Brasília was built from scratch and became the capital in 1960. Rio was the capital before that."},
 {s:"World",q:"How many member states does the United Nations have?",a:"193",w:["195","188","201"],x:"The Vatican and Palestine are observer states, which is why 195 often comes up as the count of countries."},
 {s:"Art",q:"Which sculptor created The Thinker?",a:"Auguste Rodin",w:["Michelangelo","Donatello","Antonio Canova"],x:"It began as a figure of Dante for Rodin's Gates of Hell, a giant bronze doorway."},
 {s:"Science",q:"Roughly how fast does light travel?",a:"300,000 km per second",w:["30,000 km per second","3,000,000 km per second","300,000 km per hour"],x:"The exact figure is 299,792 km/s. Light could go around Earth about 7.5 times in one second."},
 {s:"History",q:"Which country was the first to give all women the right to vote in national elections?",a:"New Zealand",w:["The United States","The United Kingdom","Finland"],x:"New Zealand did it in 1893. Finland followed in 1906 and was the first to let women stand for parliament."},
 {s:"History",q:"In which country is the ancient city of Petra?",a:"Jordan",w:["Egypt","Lebanon","Syria"],x:"The Nabataeans carved it into rose-red cliffs over 2,000 years ago."},
 {s:"History",q:"Suleiman the Magnificent ruled which empire?",a:"The Ottoman Empire",w:["The Persian Empire","The Mughal Empire","The Byzantine Empire"],x:"He reigned from 1520 to 1566, at the empire's peak. The Turks called him Suleiman the Lawgiver."},
 {s:"Culture",q:"What is the longest-running show in Broadway history?",a:"The Phantom of the Opera",w:["Cats","Chicago","The Lion King"],x:"It ran for 35 years and nearly 14,000 performances before closing in 2023."},
 {s:"Biology",q:"Which immune cells turn into plasma cells that produce antibodies?",a:"B cells",w:["T cells","Neutrophils","Macrophages"],x:"Activated B cells become plasma cells, which can each release thousands of antibodies a second. T cells kill infected cells and coordinate the response."},
 {s:"Electronics",q:"An ideal op amp is wired as a non-inverting amplifier with an 8 kΩ feedback resistor and a 2 kΩ resistor to ground. With 1.2 V in, what is the output?",a:"6 V",w:["4.8 V","−4.8 V","0.24 V"],x:"Non-inverting gain is 1 + Rf/R1 = 1 + 8/2 = 5, so 1.2 V × 5 = 6 V. 4.8 V forgets the +1, and −4.8 V uses the inverting formula."}
];
const L="ABCD", app=document.getElementById("app"), meta=document.getElementById("meta"), track=document.getElementById("track");
const RM=matchMedia("(prefers-reduced-motion: reduce)");
const SVG={ok:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  bad:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>'};
let order, i, score, log;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
function icon(k){const t=document.createElement("template");t.innerHTML=SVG[k];return t.content.firstChild}
function badge(kind,text){const b=el("span","badge");b.append(icon(kind),text);return b}
const rise=e=>{e.setAttribute("data-rise","");return e};
function screen(...parts){const c=el("section","scr");c.append(...parts);c.querySelectorAll("[data-rise]").forEach((e,k)=>e.style.setProperty("--i",Math.min(k,8)));app.replaceChildren(c);return c}
function drawTrack(){track.innerHTML="";for(let k=0;k<Q.length;k++){const b=el("i");if(k<log.length)b.className=log[k].ok?"ok":"bad";else if(k===i)b.className="now";track.append(b)}}
function start(){order=shuffle(Q).map(q=>({...q,c:shuffle([q.a,...q.w])}));i=0;score=0;log=[];track.hidden=false;ask();scrollTo(0,0)}
function ask(){
  const q=order[i];meta.textContent=`Q ${i+1} / ${Q.length} · Score ${score}`;drawTrack();
  const cap=el("p","cap",`Question ${i+1} of ${Q.length} · `);cap.append(el("b",null,q.s));
  const side=el("div","side");side.append(rise(el("h1","q",q.q)),rise(cap));
  const opts=el("div","opts");
  q.c.forEach((t,k)=>{const b=el("button","opt");b.id=`opt-${i}-${k}`;b.dataset.k=k;b.style.setProperty("--k",k);
    b.append(el("span","k",L[k]),el("span","t",t));b.onclick=()=>answer(k,opts,side);opts.append(b)});
  const a=el("div","ask");a.append(side,opts);screen(a);
}
function answer(k,opts,side){
  const q=order[i],ok=q.c[k]===q.a;if(ok)score++;log.push({ok,q});
  opts.classList.add("revealed");
  [...opts.children].forEach((b,j)=>{b.disabled=true;
    if(q.c[j]===q.a){b.classList.add("right");b.append(badge("ok",j===k?"Your pick":"Answer"))}
    else if(j===k){b.classList.add("wrong");b.append(badge("bad","Your pick"))}
    else b.classList.add("dim")});
  const v=el("div","verdict "+(ok?"ok":"bad"));v.setAttribute("role","status");
  v.append(el("span","p",ok?"Nice. One more point.":`The answer is ${q.a}.`),el("span","w",ok?"Correct":"Not quite"));
  const why=el("p","why");why.append(el("b",null,ok?"Correct. ":"Answer: "+q.a+". "),q.x);
  const n=el("button","btn wide",i+1<Q.length?"Next Question":"Final Question");n.id="next";
  n.onclick=()=>{i++;i<Q.length?ask():hazel()};
  const after=el("div","after");after.append(v,why,n);side.parentElement.append(after);
  n.focus({preventScroll:true});n.scrollIntoView({block:"nearest",behavior:RM.matches?"auto":"smooth"});
  meta.textContent=`Q ${i+1} / ${Q.length} · Score ${score}`;drawTrack();
}
function hazel(){
  meta.textContent=`Done · Score ${score} / ${Q.length}`;drawTrack();
  const t=el("textarea");t.id="hazel";t.name="hazel";t.autocomplete="off";t.setAttribute("aria-label","Your answer");t.placeholder="Write your answer…";
  const b=el("button","btn wide","Finish");b.id="finish";
  b.onclick=()=>{t.value="";results()};   // answer is intentionally discarded
  const w=el("div","hz");w.style.cssText="display:flex;flex-direction:column;gap:18px";
  w.append(rise(el("h1","shout","What is hazel?")),rise(el("p","note","Final question · Open response · Not scored")),
    rise(el("p","lead","Type whatever you like. It isn't saved or sent anywhere.")),rise(t),rise(b));
  screen(w);scrollTo(0,0);
}
function results(){
  const pct=Math.round(score/Q.length*100);
  const verdict=pct>=90?"Certified know-it-all.":pct>=75?"Seriously sharp.":pct>=60?"Solid. You know your stuff.":pct>=40?"Not bad at all.":"Tough one. Try it again?";
  meta.textContent=`Done · Score ${score} / ${Q.length}`;track.hidden=true;
  const sc=el("div","score");sc.setAttribute("aria-label",`${score} out of ${Q.length}`);sc.append(el("span","n",String(score)),el("span","of",`/ ${Q.length}`));
  const p=el("p","pct");p.append(el("b",null,`${pct}%. `),verdict);
  const again=el("button","btn wide","Take It Again");again.id="again";again.onclick=start;
  const top=el("div","top");top.append(el("h1","sr","Your results"),rise(sc),rise(p),rise(again));
  const ul=el("ol","review");ul.setAttribute("aria-label","Your answers");
  log.forEach((r,k)=>{const li=el("li"),m=el("span","m "+(r.ok?"ok":"bad"));m.append(icon(r.ok?"ok":"bad"),el("span","sr",r.ok?"Right":"Wrong"));
    const d=el("div","qq",`${r.q.q}`);d.append(el("span","a",r.q.a));li.append(m,d);ul.append(li)});
  const res=el("div","res");res.append(top,rise(ul));screen(res);scrollTo(0,0);
}
start();
</script>
</body>
</html>
